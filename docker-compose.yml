services:
  backend:
    build:
      context: .
      dockerfile: fhir-backend-dynamic/Dockerfile
    ports:
      - "8000:8000"
    environment:
      FHIR_BASE_URL: "https://hapi.fhir.org/baseR4/"
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8000/api/health')"]
      interval: 10s
      timeout: 5s
      retries: 5

  ui:
    build:
      context: .
      dockerfile: Dockerfile
    ports:
      - "3000:3000"
    depends_on:
      backend:
        condition: service_healthy